<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galería de Partículas PixiJS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white; 
            touch-action: none;
        }
        
        canvas { display: block; }

        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            z-index: 100;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        h3 { margin: 0; font-size: 16px; color: #fff; font-weight: 600; }
        .counter { font-size: 12px; color: #888; }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .select-wrapper {
            flex-grow: 1;
            position: relative;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            appearance: none;
            outline: none;
        }
        
        .select-wrapper::after {
            content: '▼';
            font-size: 10px;
            color: #aaa;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .nav-btn {
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-btn:active { background: #c2185b; transform: scale(0.95); }
        .nav-btn:disabled { background: #444; color: #777; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="loading">Cargando efecto...</div>

    <div id="ui-container">
        <div class="header-row">
            <h3 id="effect-title">Galería de Efectos</h3>
            <span class="counter" id="effect-counter">0 / 0</span>
        </div>
        <div class="controls-row">
            <button class="nav-btn" id="btn-prev">❮</button>
            
            <div class="select-wrapper">
                <select id="json-select">
                    <option value="" disabled selected>Selecciona efecto...</option>
                </select>
            </div>

            <button class="nav-btn" id="btn-next">❯</button>
        </div>
    </div>

    <script>
        // ==========================================
        //  LISTA DE ARCHIVOS ACTUALIZADA
        // ==========================================
        const AVAILABLE_EXAMPLES = [
            { name: "Monedas", file: "monedas.json" },
            { name: "1",       file: "1.json" },
            { name: "2",       file: "2.json" },
            { name: "3",       file: "3.json" },
            { name: "4",       file: "4.json" }
        ];

        // ==========================================
        //  CLASE DEL MOTOR (RUNTIME)
        // ==========================================
        class PixiParticleRuntime {
            constructor(parentContainer, jsonData) {
                this.parent = parentContainer;
                this.layers = [];
                this.particles = [];
                this.globalTime = 0;
                this.emitter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
                
                this.Generators = {
                    glow: (c) => this.renderGen(64, x => { const g = x.createRadialGradient(32,32,2, 32,32,30); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,64,64); }),
                    hardCircle: (c) => this.renderGen(64, x => { x.fillStyle = c; x.beginPath(); x.arc(32,32,30,0,Math.PI*2); x.fill(); }),
                    smoke: (c) => this.renderGen(64, x => { const g = x.createRadialGradient(32,32,10, 32,32,32); g.addColorStop(0, this.hexToRgba(c, 0.8)); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,64,64); }),
                    ring: (c) => this.renderGen(64, x => { x.strokeStyle = c; x.lineWidth = 4; x.beginPath(); x.arc(32,32,25,0,Math.PI*2); x.stroke(); })
                };

                this.init(jsonData);
            }

            setEmitterPos(x, y) {
                this.emitter.x = x;
                this.emitter.y = y;
            }

            destroy() {
                this.layers.forEach(l => {
                    if (l.container) l.container.destroy({ children: true });
                });
                this.layers = [];
                this.particles = [];
            }

            init(data) {
                if (data.bg) document.body.style.background = data.bg;
                const layerData = data.layers || data;
                
                layerData.forEach((ld, index) => {
                    const layer = {
                        config: ld.config,
                        source: ld.source,
                        type: ld.renderType || 'particle_system',
                        visible: ld.visible !== false,
                        container: new PIXI.Container(),
                        spawnTimer: 0,
                        texture: null
                    };
                    layer.container.zIndex = index;
                    this.generateTextureForLayer(layer);

                    if (layer.type === 'static_image') {
                        const s = new PIXI.Sprite(layer.texture);
                        s.anchor.set(0.5);
                        const c = layer.config.static;
                        s.position.set(c.x, c.y);
                        s.rotation = (c.rotation || 0) * Math.PI / 180;
                        s.scale.set(c.scale !== undefined ? c.scale : 1);
                        s.alpha = c.opacity !== undefined ? c.opacity : 1;
                        layer.container.addChild(s);
                    }

                    if (layer.visible) {
                        this.parent.addChild(layer.container);
                    }
                    this.layers.push(layer);
                });
                this.parent.sortableChildren = true;
            }

            generateTextureForLayer(layer) {
                const s = layer.source;
                if (s.type === 'generator') {
                    if (this.Generators[s.genType]) {
                        const canvas = this.Generators[s.genType](s.genColor || '#ffffff');
                        layer.texture = PIXI.Texture.from(canvas);
                    } else {
                        layer.texture = PIXI.Texture.WHITE;
                    }
                } else if (s.type === 'image' && s.imageSrc) {
                    layer.texture = PIXI.Texture.from(s.imageSrc);
                } else if (s.type === 'sequence' && s.sequenceSrcs) {
                    layer.texture = s.sequenceSrcs.map(src => PIXI.Texture.from(src));
                } else {
                    layer.texture = PIXI.Texture.WHITE;
                }
            }

            update(dt) {
                this.globalTime += dt;
                this.layers.forEach(l => {
                    if (!l.visible) { l.container.visible = false; return; }
                    l.container.visible = true;
                    if (l.type === 'static_image') return;

                    l.spawnTimer += dt;
                    let rate = l.config.emissionRate;
                    if (l.config.rateGraph && l.config.rateGraph.active) {
                        const dur = l.config.rateGraph.duration || 1;
                        const t = l.config.rateGraph.loop ? (this.globalTime % dur) : Math.min(this.globalTime, dur);
                        const val = this.evaluateGraph(l.config.rateGraph.nodes, t / dur);
                        rate = rate * val;
                    }

                    if (rate > 0.1) {
                        const interval = 1.0 / rate;
                        while (l.spawnTimer >= interval) {
                            l.spawnTimer -= interval;
                            this.spawnParticle(l);
                        }
                    } else {
                        l.spawnTimer = 0;
                    }
                });

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    if (p.active) {
                        this.updateParticle(p, dt);
                    } else {
                        p.sprite.destroy();
                        this.particles.splice(i, 1);
                    }
                }
            }

            spawnParticle(layer) {
                const c = layer.config;
                let tex = layer.texture;
                if (Array.isArray(tex)) tex = tex[0];

                const sprite = new PIXI.Sprite(tex);
                sprite.anchor.set(0.5);
                const blendMap = {
                    'normal': PIXI.BLEND_MODES.NORMAL,
                    'add': PIXI.BLEND_MODES.ADD,
                    'screen': PIXI.BLEND_MODES.SCREEN,
                    'multiply': PIXI.BLEND_MODES.MULTIPLY
                };
                sprite.blendMode = blendMap[c.blendMode] || PIXI.BLEND_MODES.NORMAL;
                layer.container.addChild(sprite);

                const p = {
                    sprite: sprite,
                    layer: layer,
                    active: true,
                    age: 0,
                    life: c.life.min + Math.random() * (c.life.max - c.life.min),
                    x: 0, y: 0, z: 0,
                    vx: 0, vy: 0, vz: 0,
                    scaleStart: c.scale.start,
                    scaleEnd: c.scale.end,
                    alphaStart: c.alpha.start,
                    alphaEnd: c.alpha.end,
                    rotationOffset: 0,
                    sizeMult: 1,
                    emissionAngle: 0
                };

                const ox = this.emitter.x;
                const oy = this.emitter.y;
                let sx = ox, sy = oy, sz = 0, ea = 0;
                const g = c.geometry;

                if (g.type === 'point') {
                    ea = (c.rotation.min + Math.random() * (c.rotation.max - c.rotation.min)) * Math.PI / 180;
                } 
                else if (g.type === 'ellipse') {
                    const rot = g.ellipse.rotation * Math.PI / 180;
                    const t = (g.ellipse.minAngle + Math.random() * (g.ellipse.maxAngle - g.ellipse.minAngle)) * Math.PI / 180;
                    const lx = Math.cos(t) * g.ellipse.rx;
                    const ly = Math.sin(t) * g.ellipse.ry;
                    sx = ox + lx * Math.cos(rot) - ly * Math.sin(rot);
                    sy = oy + lx * Math.sin(rot) + ly * Math.cos(rot);
                    ea = t + rot;
                }
                else if (g.type === 'line') {
                    const rad = g.line.angle * Math.PI / 180;
                    const t = (Math.random() - 0.5) * g.line.len;
                    sx = ox + Math.cos(rad) * t;
                    sy = oy + Math.sin(rad) * t;
                    ea = rad - Math.PI / 2;
                }
                else if (g.type === 'sphere') {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = 2 * Math.PI * u;
                    const phi = Math.acos(2 * v - 1);
                    const r = g.sphere.radius;
                    sx = ox + r * Math.sin(phi) * Math.cos(theta);
                    sy = oy + r * Math.sin(phi) * Math.sin(theta);
                    sz = r * Math.cos(phi);
                    ea = Math.atan2(sy - oy, sx - ox);
                }

                p.x = sx; p.y = sy; p.z = sz; p.emissionAngle = ea;

                const baseSpd = c.speed.value !== undefined ? c.speed.value : 100;
                const randSpd = c.speed.random !== undefined ? c.speed.random : 0;
                const spd = baseSpd + (Math.random() * randSpd);

                if (g.type === 'sphere') {
                    const dx = sx - ox, dy = sy - oy, dz = sz;
                    const mag = Math.hypot(dx, dy, dz) || 1;
                    p.vx = (dx / mag) * spd; p.vy = (dy / mag) * spd; p.vz = (dz / mag) * spd;
                } else {
                    p.vx = Math.cos(ea) * spd; p.vy = Math.sin(ea) * spd;
                }

                const tCfg = c.transform || { rotation: 0, randomRotation: 0, randomSize: 0, radialLock: false };
                p.sizeMult = 1 - (Math.random() * tCfg.randomSize);
                p.rotationOffset = (Math.random() - 0.5) * 2 * (tCfg.randomRotation * Math.PI / 180);

                this.particles.push(p);
            }

            updateParticle(p, dt) {
                const c = p.layer.config;
                p.age += dt;
                if (p.age >= p.life) { p.active = false; return; }

                p.vx += c.gravity.x * dt;
                p.vy += c.gravity.y * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.z += (p.vz || 0) * dt;

                const t = p.age / p.life;
                let currentScale = p.scaleStart * (1 - t) + p.scaleEnd * t;

                let currentAlpha = 1;
                if (c.opacityGraph && c.opacityGraph.active) {
                    let gt = p.age;
                    const dur = c.opacityGraph.linkToLife ? p.life : c.opacityGraph.duration;
                    if (c.opacityGraph.loop) gt = gt % dur; else if (gt > dur) gt = dur;
                    currentAlpha = this.evaluateGraph(c.opacityGraph.nodes, gt / dur);
                } else {
                    currentAlpha = p.alphaStart * (1 - t) + p.alphaEnd * t;
                }

                if (c.colorGraph && c.colorGraph.active) {
                    let gt = p.age;
                    const dur = c.colorGraph.linkToLife ? p.life : c.colorGraph.duration;
                    if (c.colorGraph.loop) gt = gt % dur; else if (gt > dur) gt = dur;
                    const colData = this.evaluateColorGraph(c.colorGraph.nodes, gt / dur);
                    const i = colData.i;
                    let r = colData.r, g = colData.g, b = colData.b;
                    if (i > 0) { r += (255 - r) * i; g += (255 - g) * i; b += (255 - b) * i; } 
                    else if (i < 0) { const f = 1 + i; r *= f; g *= f; b *= f; }
                    p.sprite.tint = (Math.floor(r) << 16) + (Math.floor(g) << 8) + Math.floor(b);
                } else {
                    p.sprite.tint = 0xFFFFFF;
                }

                if (!c.opacityGraph || !c.opacityGraph.active) currentAlpha *= c.globalOpacity;
                p.sprite.alpha = Math.max(0, Math.min(1, currentAlpha));

                let perspectiveScale = 1;
                if (c.geometry.type === 'sphere') { perspectiveScale = 1 + (p.z / 300); }

                p.sprite.scale.set(currentScale * perspectiveScale * p.sizeMult);
                p.sprite.position.set(p.x, p.y);

                const tCfg = c.transform;
                if (tCfg.radialLock) {
                    p.sprite.rotation = p.emissionAngle + (tCfg.rotation * Math.PI / 180);
                } else {
                    p.sprite.rotation = (tCfg.rotation * Math.PI / 180) + p.rotationOffset;
                }

                if (Array.isArray(p.layer.texture)) {
                    const frames = p.layer.texture;
                    const frameIdx = Math.floor(((p.age / p.life) * (c.animSpeed || 1)) % 1 * frames.length);
                    p.sprite.texture = frames[frameIdx] || frames[0];
                }
            }

            renderGen(s, fn) { const c = document.createElement('canvas'); c.width = s; c.height = s; fn(c.getContext('2d')); return c; }
            hexToRgba(hex, alpha) {
                if (!hex) return `rgba(255,255,255,${alpha})`;
                const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r},${g},${b},${alpha})`;
            }
            hexToRgbObj(hex) { const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16); return {r,g,b}; }
            
            evaluateGraph(points, t) {
                if (!points.length) return 1;
                if (t <= points[0].x) return points[0].y;
                if (t >= points[points.length - 1].x) return points[points.length - 1].y;
                for (let i = 0; i < points.length - 1; i++) {
                    if (t >= points[i].x && t <= points[i + 1].x) {
                        const localT = (t - points[i].x) / (points[i + 1].x - points[i].x);
                        if (points[i].type === 'smooth') {
                            const mu2 = (1 - Math.cos(localT * Math.PI)) / 2;
                            return points[i].y * (1 - mu2) + points[i + 1].y * mu2;
                        } else return points[i].y + (points[i + 1].y - points[i].y) * localT;
                    }
                }
                return 1;
            }

            evaluateColorGraph(points, t) {
                if (!points.length) return { r: 255, g: 255, b: 255, i: 0 };
                const sPoints = [...points].sort((a, b) => a.x - b.x);
                if (t <= sPoints[0].x) { const c = this.hexToRgbObj(sPoints[0].color); return { r: c.r, g: c.g, b: c.b, i: sPoints[0].y }; }
                if (t >= sPoints[sPoints.length - 1].x) { const c = this.hexToRgbObj(sPoints[sPoints.length - 1].color); return { r: c.r, g: c.g, b: c.b, i: sPoints[sPoints.length - 1].y }; }
                for (let i = 0; i < sPoints.length - 1; i++) {
                    if (t >= sPoints[i].x && t <= sPoints[i + 1].x) {
                        const localT = (t - sPoints[i].x) / (sPoints[i + 1].x - sPoints[i].x);
                        const c1 = this.hexToRgbObj(sPoints[i].color);
                        const c2 = this.hexToRgbObj(sPoints[i + 1].color);
                        const i1 = sPoints[i].y;
                        const i2 = sPoints[i + 1].y;
                        const r = c1.r + (c2.r - c1.r) * localT;
                        const g = c1.g + (c2.g - c1.g) * localT;
                        const b = c1.b + (c2.b - c1.b) * localT;
                        let yVal;
                        if (sPoints[i].type === 'smooth') {
                            const mu2 = (1 - Math.cos(localT * Math.PI)) / 2;
                            yVal = i1 * (1 - mu2) + i2 * mu2;
                        } else yVal = i1 + (i2 - i1) * localT;
                        return { r, g, b, i: yVal };
                    }
                }
                return { r: 255, g: 255, b: 255, i: 0 };
            }
        }

        // ==========================================
        //  UI LOGIC
        // ==========================================

        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundAlpha: 0,
            antialias: true,
            resolution: window.devicePixelRatio || 1
        });
        document.body.appendChild(app.view);
        document.body.appendChild(document.getElementById('ui-container'));

        let activeRuntime = null;
        let currentIndex = -1;

        const uiSelect = document.getElementById('json-select');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const lblTitle = document.getElementById('effect-title');
        const lblCounter = document.getElementById('effect-counter');
        const loadingIndicator = document.getElementById('loading');

        function initUI() {
            AVAILABLE_EXAMPLES.forEach((ex, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = ex.name;
                uiSelect.appendChild(opt);
            });
            updateButtons();
        }

        async function loadExample(index) {
            if (index < 0 || index >= AVAILABLE_EXAMPLES.length) return;
            
            const target = AVAILABLE_EXAMPLES[index];
            loadingIndicator.style.display = 'block';
            
            try {
                const response = await fetch(target.file);
                if (!response.ok) throw new Error("404 Not Found");
                
                const jsonData = await response.json();

                if (activeRuntime) activeRuntime.destroy();
                activeRuntime = new PixiParticleRuntime(app.stage, jsonData);
                
                currentIndex = index;
                uiSelect.value = index;
                lblTitle.innerText = jsonData.name || target.name;
                
            } catch (err) {
                console.error(err);
                alert("Error cargando: " + target.file + "\n(¿Subiste el archivo al repo?)");
            } finally {
                loadingIndicator.style.display = 'none';
                updateButtons();
            }
        }

        function updateButtons() {
            btnPrev.disabled = currentIndex <= 0;
            btnNext.disabled = currentIndex >= AVAILABLE_EXAMPLES.length - 1;
            lblCounter.innerText = (currentIndex + 1) + " / " + AVAILABLE_EXAMPLES.length;
        }

        uiSelect.addEventListener('change', (e) => loadExample(parseInt(e.target.value)));
        
        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) loadExample(currentIndex - 1);
        });
        
        btnNext.addEventListener('click', () => {
            if (currentIndex < AVAILABLE_EXAMPLES.length - 1) loadExample(currentIndex + 1);
        });

        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
            if(activeRuntime) {
                activeRuntime.setEmitterPos(window.innerWidth/2, window.innerHeight/2);
            }
        });

        app.ticker.add((delta) => {
            if (activeRuntime) activeRuntime.update(delta / 60);
        });

        initUI();
        if (AVAILABLE_EXAMPLES.length > 0) {
            loadExample(0);
        }

    </script>
</body>
</html>
