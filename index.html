<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Editor V18.11: Fix Preset Loading</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121212; font-family: 'Segoe UI', sans-serif; color: #ccc; user-select: none; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        
        /* MENU SUPERIOR */
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 30px;
            background: #252525; border-bottom: 1px solid #333;
            display: flex; align-items: center; padding: 0 10px; box-sizing: border-box;
            z-index: 100; font-size: 12px;
        }
        .menu-dropdown { 
            position: relative; cursor: pointer; padding: 0 10px; color: #eee; 
            height: 100%; display: flex; align-items: center; 
        }
        .menu-dropdown:hover { background: #444; }
        .menu-content { 
            display: none; position: absolute; top: 100%; left: 0; 
            background: #2d2d2d; border: 1px solid #444; min-width: 220px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        }
        .menu-dropdown:hover .menu-content { display: block; }
        .menu-item { padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;}
        .menu-item:hover { background: #007acc; color: #fff; }
        .menu-separator { height: 1px; background: #444; margin: 2px 0; }
        
        #project-name { margin-left: 20px; font-weight: bold; color: #ffd700; flex: 1; text-align: center; }

        /* PANEL LATERAL */
        #ui-panel { position: absolute; top: 30px; right: 0; width: 440px; height: calc(100vh - 30px); background: #1e1e1e; border-left: 1px solid #333; display: flex; flex-direction: column; z-index: 10; }
        #ui-content { flex: 1; overflow-y: auto; padding: 10px; scrollbar-width: thin; scrollbar-color: #444 #222; }

        /* BOTONES */
        .btn { padding: 6px; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; color: #fff; margin-bottom: 4px; display:flex; justify-content:center; align-items:center; }
        .btn:hover { filter: brightness(1.1); }
        .btn-new { background: #444; border: 1px dashed #666; width: 100%; padding: 10px; margin-bottom: 5px; }
        .btn-img { background: #37474f; border: 1px dashed #78909c; width: 100%; padding: 10px; margin-bottom: 10px; }
        
        .btn-purple { background: #7b1fa2; width: 100%; }
        .btn-upload { background: #2e7d32; width: 100%; }
        .btn-graph { background: #00897b; width:auto; padding: 2px 6px; font-size: 10px; margin-left: auto; border-radius: 2px; }
        .btn-copy { background: #555; width:auto; padding: 4px 8px; font-size: 10px; margin-left:2px; }
        .btn-blue { background: #1565c0; width: auto; padding: 4px 8px; font-size: 10px; margin-right: 5px; }
        
        /* POWER BUTTON */
        .btn-power {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid #555;
            background: #222; color: #555; font-size: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; margin-right: 8px;
        }
        .btn-power.active {
            border-color: #00e676; background: #00e676; color: #000; box-shadow: 0 0 8px #00e676;
        }

        /* CAPAS */
        .layer-container { background: #2a2a2a; border: 1px solid #383838; border-radius: 4px; margin-bottom: 6px; }
        .layer-container.is-static { border-left: 4px solid #29b6f6; }
        .sub-layer-container { background: #151019; border-left: 3px solid #ab47bc; margin: 5px; padding: 5px; border-radius: 4px; }
        summary { padding: 5px; background: #2d2d2d; cursor: pointer; display: flex; align-items: center; justify-content: space-between; height: 32px; }
        .layer-left, .layer-right { display: flex; align-items: center; gap: 8px; }
        .icon-btn { cursor: pointer; opacity: 0.8; font-size: 18px; padding: 4px; line-height: 1; }
        .icon-btn:hover { opacity: 1; transform: scale(1.1); background: #444; border-radius: 4px; }
        .layer-controls { padding: 8px; background: #222; border-top: 1px solid #333; }

        /* CONTROLES */
        .control-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
        select, input[type="text"] { background: #333; color: #eee; border: 1px solid #444; padding: 3px; font-size: 11px; flex: 1; }
        .control-group { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #333; }
        .group-label { font-size: 10px; color: #777; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
        
        .control { display: flex; align-items: center; margin-bottom: 4px; font-size: 11px; position: relative; transition: opacity 0.3s; }
        .control label { flex: 0 0 70px; color: #aaa; z-index: 2; }
        .control input[type="range"] { flex: 1; margin: 0 5px; accent-color: #ffd700; height: 4px; background: #444; border-radius: 2px; appearance: none; cursor: pointer; z-index: 2; }
        .control input[type="number"] { width: 45px; background: #111; border: 1px solid #444; color: #ffd700; text-align: right; padding: 2px; z-index: 2; }
        
        /* LIVE BAR */
        .live-bar {
            position: absolute; left: 75px; top: 50%; transform: translateY(-50%);
            height: 4px; background: #00e676; z-index: 1; pointer-events: none;
            opacity: 0; transition: width 0.05s linear; border-radius: 2px;
        }

        .disabled-control { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .sub-layer-container input[type="range"] { accent-color: #e040fb; }
        .sub-layer-container input[type="number"] { color: #ea80fc; }

        /* GRAPH WINDOW */
        #graph-window { position: absolute; top: 100px; left: 100px; width: 500px; height: 380px; background: #222; border: 1px solid #555; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; flex-direction: column; z-index: 500; }
        #graph-header { padding: 8px; background: #333; border-bottom: 1px solid #444; cursor: move; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 12px; color: #eee; }
        #graph-body { flex: 1; position: relative; background: #151515; }
        #graph-footer { padding: 8px; background: #2a2a2a; border-top: 1px solid #444; display: flex; gap: 10px; align-items: center; font-size: 11px; flex-wrap: wrap; }
        
        .graph-label-y { position: absolute; left: 5px; font-size: 10px; color: #aaa; pointer-events: none; font-family: monospace; z-index: 10; text-shadow: 1px 1px 0 #000; }
        #graph-max-val { top: 5px; }
        #graph-mid-val { top: 50%; transform: translateY(-50%); color: #666; }
        #graph-min-val { bottom: 5px; }

        /* MODAL */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; }
        #modal-box { background: #222; border: 1px solid #444; width: 350px; max-height: 80vh; padding: 20px; display: flex; flex-direction: column; }
        #modal-list { flex: 1; overflow-y: auto; margin: 10px 0; border: 1px solid #333; max-height: 300px; }
        .preset-item { padding: 8px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .preset-item:hover { background: #333; }
        .preset-actions { display: flex; gap: 5px; }

        #ctx-menu { display:none; position:fixed; background:#2d2d2d; border:1px solid #555; z-index:300; box-shadow: 3px 3px 8px rgba(0,0,0,0.6); min-width: 150px; }
        .ctx-item { padding:8px 12px; cursor:pointer; font-size:12px; color:#eee; border-bottom: 1px solid #383838; }
        .ctx-item:hover { background:#007acc; color:#fff; }
        .ctx-item:last-child { border-bottom: none; }
        .ctx-disabled { opacity: 0.5; pointer-events: none; cursor: default; }
        .ctx-separator { height: 1px; background: #444; margin: 2px 0; }

        #hidden-file-input, #hidden-seq-input, #hidden-json-input { display: none; }
        #emitter-marker { position: absolute; width: 14px; height: 14px; border: 2px solid #ffd700; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 10px #ffd700; z-index: 5; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ffd700; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 12px; opacity: 0; transition: opacity 0.3s; z-index: 200; }
        
        #graph-color-picker { width: 30px; height: 20px; border: 1px solid #555; background: none; cursor: pointer; padding: 0; }
        .input-config { background:#111; border:1px solid #555; color:#00bcd4; width:50px; text-align:center; }
        .input-color-config { width: 30px; height: 20px; padding:0; background:none; border:1px solid #555; cursor:pointer; }
    </style>
</head>
<body>

    <nav id="main-menu">
        <div class="menu-dropdown">
            <span>📁 ARCHIVOS</span>
            <div class="menu-content">
                <div class="menu-item" onclick="app.newPreset()">📄 Nuevo</div>
                <div class="menu-item" onclick="app.loadPresetWindow()">📂 Cargar / Mezclar</div>
                <div class="menu-item" onclick="app.savePreset(false)">💾 Guardar (CTRL+s)</div>
                <div class="menu-item" onclick="app.savePreset(true)">💾 Guardar Como...</div>
                <div class="menu-item" onclick="document.getElementById('hidden-json-input').click()">⬆️ Importar JSON</div>
                <div class="menu-item" onclick="app.exportJSON()">⬇️ Exportar JSON</div>
            </div>
        </div>
        <div class="menu-dropdown">
            <span>✏️ EDITAR</span>
            <div class="menu-content">
                <div class="menu-item" onclick="app.undo()"><span>↩️ Deshacer</span> <span style="opacity:0.5; font-size:10px">Ctrl+Z</span></div>
                <div class="menu-item" onclick="app.redo()"><span>↪️ Rehacer</span> <span style="opacity:0.5; font-size:10px">Ctrl+Y</span></div>
                <div class="menu-separator"></div>
                <div class="menu-item" style="cursor:default; background:none; color:#aaa; font-weight:bold; font-size:10px;">CONFIGURACIÓN</div>
                <div class="menu-item">
                    <span>Pasos Undo:</span>
                    <input type="number" class="input-config" id="undo-limit" value="20" onchange="app.updateUndoLimit(this.value)" onclick="event.stopPropagation()">
                </div>
                <div class="menu-item">
                    <span>Color Fondo:</span>
                    <input type="color" class="input-color-config" id="bg-color-picker" value="#121212" oninput="app.updateBgColor(this.value)" onclick="event.stopPropagation()">
                </div>
            </div>
        </div>
        <div id="project-name">Sin Título</div>
    </nav>

    <div id="emitter-marker"></div>
    <div id="toast">Notificación</div>
    
    <div id="ctx-menu"></div>
    
    <canvas id="canvas"></canvas>

    <div id="graph-window">
        <div id="graph-header">
            <div style="display:flex; align-items:center">
                <div id="graph-power" class="btn-power" onclick="app.saveState(); GraphEditor.togglePower()">⏻</div>
                <span id="graph-title">Gráfica</span>
            </div>
            <button class="btn btn-copy" style="width:20px; height:20px; padding:0;" onclick="document.getElementById('graph-window').style.display='none'">x</button>
        </div>
        <div id="graph-body">
            <div id="graph-max-val" class="graph-label-y">1.0</div>
            <div id="graph-mid-val" class="graph-label-y">0.0</div>
            <div id="graph-min-val" class="graph-label-y">-1.0</div>
            <canvas id="graph-canvas" width="500" height="310" style="width:100%; height:100%"></canvas>
        </div>
        <div id="graph-footer">
            <label style="display:flex; align-items:center" id="lbl-link"><input type="checkbox" id="chk-link" onmousedown="app.saveState()" onchange="GraphEditor.updateConfig()"> Link Vida</label>
            <label style="display:flex; align-items:center"><input type="checkbox" id="chk-loop" onmousedown="app.saveState()" onchange="GraphEditor.updateConfig()"> Loop</label>
            
            <div style="width:1px; height:20px; background:#444; margin:0 5px;"></div>
            
            <label>Val Y:</label>
            <input type="number" id="inp-point-y" step="0.1" style="width:50px; background:#111; color:#00bcd4; border:1px solid #444" onfocus="app.saveState()" onchange="GraphEditor.updatePointValue()">

            <div id="box-color-picker" style="display:none; align-items:center; margin-left:5px; gap:5px; border-left:1px solid #444; padding-left:5px;">
                <label>Color:</label>
                <input type="color" id="graph-color-picker" onmousedown="app.saveState()" oninput="GraphEditor.updatePointColor()">
            </div>

            <div style="flex:1"></div>
            <label>Duración (s):</label>
            <input type="number" id="inp-duration" value="1.0" step="0.1" style="width:50px; background:#111; color:#eee; border:1px solid #444" onfocus="app.saveState()" onchange="GraphEditor.updateConfig()">
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <h2 style="margin:0 0 10px 0; color:#ffd700; text-align:center">Gestor de Presets</h2>
            <div id="modal-list"></div>
            <button class="btn btn-purple" onclick="document.getElementById('modal-overlay').style.display='none'">Cerrar</button>
        </div>
    </div>

    <div id="ui-panel">
        <div id="ui-content">
            <button class="btn btn-new" id="add-layer-btn" onclick="app.addLayer('particle')">➕ Nueva Capa Partícula</button>
            <button class="btn btn-img" id="add-img-btn" onclick="app.addLayer('static')">🖼️ Nueva Capa Imagen</button>
            <div id="layers-list"></div>
        </div>
    </div>

    <input type="file" id="hidden-file-input" accept="image/png, image/jpeg, image/webp">
    <input type="file" id="hidden-seq-input" accept="image/png, image/jpeg, image/webp" multiple>
    <input type="file" id="hidden-json-input" accept=".json">

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const layersList = document.getElementById('layers-list');
        const marker = document.getElementById('emitter-marker');
        const toastEl = document.getElementById('toast');
        const projectNameEl = document.getElementById('project-name');
        
        const helperCanvas = document.createElement('canvas');
        const helperCtx = helperCanvas.getContext('2d');
        helperCanvas.width = 128; helperCanvas.height = 128;

        let width, height;
        let particles = [], layers = [], lastTime = 0, currentPresetName = null, globalTime = 0;
        let bgColor = "#121212";
        const emitter = { x: window.innerWidth / 2, y: window.innerHeight / 2, isDragging: false };
        let lastEmitter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        
        let contextTarget = null;
        let contextParentArray = null;
        let clipboardConfig = null;
        let draggingImageLayer = null;

        function showToast(msg) { toastEl.innerText = msg; toastEl.style.opacity = 1; setTimeout(()=>toastEl.style.opacity=0, 2000); }
        function hexToRgb(hex) { const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16); return {r,g,b}; }
        
        // --- HISTORY SYSTEM ---
        const History = {
            stack: [], redoStack: [], limit: 20,
            record: () => {
                const state = JSON.stringify({ layers: serializeLayers(), name: currentPresetName, bg: bgColor });
                if(History.stack.length > 0 && History.stack[History.stack.length-1] === state) return;
                History.stack.push(state);
                if(History.stack.length > History.limit) History.stack.shift();
                History.redoStack = []; 
            },
            undo: () => {
                if(History.stack.length === 0) { showToast("Nada que deshacer"); return; }
                const current = JSON.stringify({ layers: serializeLayers(), name: currentPresetName, bg: bgColor });
                History.redoStack.push(current);
                const prev = History.stack.pop();
                const data = JSON.parse(prev);
                loadFromState(data);
                showToast("Deshacer");
            },
            redo: () => {
                if(History.redoStack.length === 0) { showToast("Nada que rehacer"); return; }
                const current = JSON.stringify({ layers: serializeLayers(), name: currentPresetName, bg: bgColor });
                History.stack.push(current);
                const next = History.redoStack.pop();
                const data = JSON.parse(next);
                loadFromState(data);
                showToast("Rehacer");
            }
        };

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); app.undo(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); app.redo(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); app.savePreset(false); }
        });

        // --- GRAPH EDITOR ---
        const GraphEditor = {
            targetLayer: null, targetProp: null, points: [], activePoint: -1, isDragging: false, minValLabel: 0, maxValLabel: 1,
            open: (layer, prop, minVal=0, maxVal=1) => {
                GraphEditor.targetLayer = layer; GraphEditor.targetProp = prop; GraphEditor.minValLabel = minVal; GraphEditor.maxValLabel = maxVal;
                document.getElementById('graph-min-val').innerText = minVal; document.getElementById('graph-max-val').innerText = maxVal; document.getElementById('graph-mid-val').style.display = (minVal === -1) ? 'block' : 'none'; 
                let cfg;
                if(prop === 'opacity') {
                    if(!layer.config.opacityGraph) layer.config.opacityGraph = { active:false, nodes:[{x:0,y:1,type:'linear'},{x:1,y:0,type:'linear'}], linkToLife:true, loop:false, duration:1 };
                    cfg = layer.config.opacityGraph; document.getElementById('graph-title').innerText = "Gráfica Opacidad"; document.getElementById('lbl-link').style.display = 'flex';
                } else if(prop === 'emissionRate') {
                    if(!layer.config.rateGraph) layer.config.rateGraph = { active:false, nodes:[{x:0,y:1,type:'linear'},{x:1,y:1,type:'linear'}], linkToLife:false, loop:true, duration:2 };
                    cfg = layer.config.rateGraph; document.getElementById('graph-title').innerText = "Gráfica Tasa Emisión"; document.getElementById('lbl-link').style.display = 'none'; 
                } else if(prop === 'color') {
                    if(!layer.config.colorGraph) layer.config.colorGraph = { active:false, nodes:[{x:0,y:0,type:'linear',color:'#ffffff'},{x:1,y:0,type:'linear',color:'#ffffff'}], linkToLife:true, loop:false, duration:1 };
                    cfg = layer.config.colorGraph; document.getElementById('graph-title').innerText = "Gráfica Color & Intensidad"; document.getElementById('lbl-link').style.display = 'flex';
                }
                GraphEditor.points = cfg.nodes; document.getElementById('chk-link').checked = cfg.linkToLife; document.getElementById('chk-loop').checked = cfg.loop; document.getElementById('inp-duration').value = cfg.duration; document.getElementById('inp-duration').disabled = (prop==='opacity' || prop==='color') ? cfg.linkToLife : false; document.getElementById('box-color-picker').style.display = (prop === 'color') ? 'flex' : 'none';
                GraphEditor.updatePowerBtn(); GraphEditor.activePoint = -1; document.getElementById('inp-point-y').value = ''; document.getElementById('inp-point-y').disabled = true;
                document.getElementById('graph-window').style.display = 'flex'; GraphEditor.draw();
            },
            togglePower: () => { if(GraphEditor.targetLayer) { let cfg; if(GraphEditor.targetProp==='opacity') cfg = GraphEditor.targetLayer.config.opacityGraph; else if(GraphEditor.targetProp==='emissionRate') cfg = GraphEditor.targetLayer.config.rateGraph; else if(GraphEditor.targetProp==='color') cfg = GraphEditor.targetLayer.config.colorGraph; cfg.active = !cfg.active; GraphEditor.updatePowerBtn(); renderUI(); } },
            updatePowerBtn: () => { const btn = document.getElementById('graph-power'); let cfg; if(GraphEditor.targetProp==='opacity') cfg = GraphEditor.targetLayer?.config.opacityGraph; else if(GraphEditor.targetProp==='emissionRate') cfg = GraphEditor.targetLayer?.config.rateGraph; else if(GraphEditor.targetProp==='color') cfg = GraphEditor.targetLayer?.config.colorGraph; const isActive = cfg ? cfg.active : false; btn.className = isActive ? 'btn-power active' : 'btn-power'; },
            updateConfig: () => { let c; if(GraphEditor.targetProp==='opacity') c = GraphEditor.targetLayer.config.opacityGraph; else if(GraphEditor.targetProp==='emissionRate') c = GraphEditor.targetLayer.config.rateGraph; else if(GraphEditor.targetProp==='color') c = GraphEditor.targetLayer.config.colorGraph; if(GraphEditor.targetProp!=='emissionRate') c.linkToLife = document.getElementById('chk-link').checked; c.loop = document.getElementById('chk-loop').checked; c.duration = parseFloat(document.getElementById('inp-duration').value); if(GraphEditor.targetProp!=='emissionRate') document.getElementById('inp-duration').disabled = c.linkToLife; },
            updatePointValue: () => { if(GraphEditor.activePoint !== -1) { let v = parseFloat(document.getElementById('inp-point-y').value); if(isNaN(v)) v=0; if(GraphEditor.minValLabel === -1) v = Math.max(-1, Math.min(1, v)); else v = Math.max(0, Math.min(1, v)); GraphEditor.points[GraphEditor.activePoint].y = v; GraphEditor.draw(); } },
            updatePointColor: () => { if(GraphEditor.activePoint !== -1 && GraphEditor.targetProp === 'color') { GraphEditor.points[GraphEditor.activePoint].color = document.getElementById('graph-color-picker').value; GraphEditor.draw(); } },
            draw: () => {
                const cv = document.getElementById('graph-canvas'); const cx = cv.getContext('2d'); const w = cv.width, h = cv.height; cx.clearRect(0,0,w,h);
                if(GraphEditor.targetProp === 'color' && GraphEditor.points.length >= 2) { const sorted = [...GraphEditor.points].sort((a,b)=>a.x - b.x); const grad = cx.createLinearGradient(0, 0, w, 0); sorted.forEach(p => grad.addColorStop(Math.max(0, Math.min(1, p.x)), p.color)); cx.fillStyle = grad; cx.globalAlpha = 0.2; cx.fillRect(0,0,w,h); cx.globalAlpha = 1.0; }
                cx.strokeStyle='#333'; cx.lineWidth=1; cx.beginPath(); for(let i=0; i<=10; i++) { cx.moveTo(i*w/10, 0); cx.lineTo(i*w/10, h); cx.moveTo(0, i*h/10); cx.lineTo(w, i*h/10); } cx.stroke();
                if(GraphEditor.minValLabel === -1) { cx.strokeStyle='#555'; cx.beginPath(); cx.moveTo(0, h/2); cx.lineTo(w, h/2); cx.stroke(); }
                GraphEditor.points.sort((a,b)=>a.x - b.x);
                const mapY = (yVal) => { if(GraphEditor.minValLabel === -1) return (1 - (yVal + 1) / 2) * h; else return (1 - yVal) * h; };
                let cfg; if(GraphEditor.targetProp==='opacity') cfg = GraphEditor.targetLayer?.config.opacityGraph; else if(GraphEditor.targetProp==='emissionRate') cfg = GraphEditor.targetLayer?.config.rateGraph; else if(GraphEditor.targetProp==='color') cfg = GraphEditor.targetLayer?.config.colorGraph;
                cx.strokeStyle = (cfg && cfg.active) ? '#00e676' : '#555'; cx.lineWidth=2; cx.beginPath();
                if(GraphEditor.points.length > 0) { cx.moveTo(GraphEditor.points[0].x * w, mapY(GraphEditor.points[0].y)); for(let i=0; i<GraphEditor.points.length-1; i++) { const p1 = GraphEditor.points[i], p2 = GraphEditor.points[i+1]; if (p1.type === 'linear') cx.lineTo(p2.x * w, mapY(p2.y)); else { for(let j=1; j<=20; j++) { const t = j/20, mu2 = (1 - Math.cos(t * Math.PI)) / 2; const iy = p1.y * (1 - mu2) + p2.y * mu2; const ix = p1.x + (p2.x - p1.x) * t; cx.lineTo(ix*w, mapY(iy)); } } } } cx.stroke();

                if(c.colorGraph && c.colorGraph.active) { let gt = this.age; const dur = c.colorGraph.linkToLife ? this.life : c.colorGraph.duration; if(c.colorGraph.loop) gt = gt % dur; else if(gt>dur) gt = dur; const colData = evaluateColorGraph(c.colorGraph.nodes, gt/dur); const i = colData.i; let r = colData.r, g = colData.g, b = colData.b; if(i > 0) { r = r + (255 - r) * i; g = g + (255 - g) * i; b = b + (255 - b) * i; } else if (i < 0) { const f = 1 + i; r *= f; g *= f; b *= f; } this.color.r = Math.floor(r); this.color.g = Math.floor(g); this.color.b = Math.floor(b); }

                let tex = this.layer.source.texture; if(Array.isArray(tex)) { if(!tex.length)return; tex=tex[Math.floor(((this.age/this.life)*(this.layer.config.animSpeed||1))%1*tex.length)]||tex[0]; } if(!tex || !tex.complete) return;
                const tCfg = this.layer.config.transform || { rotation:0, randomRotation:0, randomSize:0, radialLock:false };

        function loop(t) {
            const dt = Math.min((t - lastTime) / 1000, 0.1); lastTime = t; globalTime += dt;
            const dEx = emitter.x - lastEmitter.x; const dEy = emitter.y - lastEmitter.y;
            if(dEx !== 0 || dEy !== 0) { particles.forEach(p => { if(p.active && p.layer.config.follow > 0) { const factor = p.layer.config.follow / 100; p.x += dEx * factor; p.y += dEy * factor; } }); }
            lastEmitter.x = emitter.x; lastEmitter.y = emitter.y;

            // DRAW LAYERS IN ORDER
            ctx.clearRect(0, 0, width, height);
            
            layers.forEach(l => { 
                if(!l.visible) return;
                
                // RENDER STATIC IMAGES
                if(l.renderType === 'static_image') {
                    if(l.source.texture && l.source.texture.complete) {
                        const conf = l.config.static;
                        ctx.save();
                        ctx.translate(conf.x, conf.y);
                        ctx.rotate(conf.rotation * Math.PI/180);
                        ctx.scale(conf.scale, conf.scale);
                        ctx.globalAlpha = conf.opacity;
                        const w = l.source.texture.width;
                        const h = l.source.texture.height;
                        ctx.drawImage(l.source.texture, -w/2, -h/2);
                        ctx.restore();
                    }
                    return;
                }

                // UPDATE PARTICLE EMITTERS
                l.spawnTimer += dt; 
                let rate = l.config.emissionRate;
                if(l.config.rateGraph && l.config.rateGraph.active) {
                    const dur = l.config.rateGraph.duration || 1;
                    const t = l.config.rateGraph.loop ? (globalTime % dur) : Math.min(globalTime, dur);
                    const val = evaluateGraph(l.config.rateGraph.nodes, t/dur);
                    rate = rate * val;
                }
                if(rate > 0.1) {
                    const interval = 1.0 / rate; 
                    while(l.spawnTimer >= interval) { l.spawnTimer -= interval; particles.push(new Particle(l)); } 
                } else { l.spawnTimer = 0; }
            });
            
            // DRAW PARTICLES
            particles.sort((a,b) => a.z - b.z);
            layers.forEach(l => { 
                if(!l.visible || l.renderType === 'static_image') return; 
                const layerParticles = particles.filter(p => p.layer === l && p.active);
                layerParticles.sort((a,b) => a.z - b.z);
                layerParticles.forEach(p => p.draw(ctx)); 
            });

            for (let i = particles.length - 1; i >= 0; i--) { const p=particles[i]; if(p.active) p.update(dt); else particles.splice(i,1); }
            requestAnimationFrame(loop);
        }

        // --- MOUSE EVENTS ---
        window.addEventListener('mousedown', e => {
            if(e.button===2 && e.target===canvas){ 
                e.preventDefault();
                const mx = e.clientX, my = e.clientY;
                for(let i=layers.length-1; i>=0; i--) {
                    const l = layers[i];
                    if(l.visible && l.renderType === 'static_image') {
                        const dist = Math.hypot(mx - l.config.static.x, my - l.config.static.y);
                        let radius = 50; 
                        if(l.source.texture) radius = (Math.max(l.source.texture.width, l.source.texture.height) * l.config.static.scale) / 2;
                        if(dist < radius) {
                            app.saveState();
                            draggingImageLayer = l;
                            return;
                        }
                    }
                }
            }
            if(e.target===canvas && e.button===0) emitter.isDragging=true; 
        });
        window.addEventListener('mouseup', () => { emitter.isDragging=false; draggingImageLayer = null; });
        window.addEventListener('mousemove', e => { 
            if(draggingImageLayer) {
                draggingImageLayer.config.static.x = e.clientX;
                draggingImageLayer.config.static.y = e.clientY;
                renderUI(); 
            } else if(emitter.isDragging) { 
                emitter.x=e.clientX; emitter.y=e.clientY; 
                marker.style.left=emitter.x+'px'; marker.style.top=emitter.y+'px'; 
            } 
        });

        document.body.style.background = bgColor;
